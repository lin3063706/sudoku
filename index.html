<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數獨遊戲</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #aaa; padding: 20px; }
        h1 { text-align: center; }
        .menu { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .menu select, .menu button { margin-right: 8px; }
        .board { display: grid; grid-template-columns: repeat(9, 40px); grid-template-rows: repeat(9, 40px); gap: 2px; background: #003366; padding: 6px; border-radius: 6px; }
        .cell { width: 40px; height: 40px; background: #fff; text-align: center; font-size: 20px; border: 1px solid #bbb; outline: none; transition: background 0.2s; }
        .cell:focus { background: #e0f7fa; }
        .cell.given { background: #e0e0e0; color: #1976d2; font-weight: bold; }
        .cell.note { font-size: 10px; color: #888; }
        .bold-border { border-width: 2px !important; }
        .info { margin: 10px 0; text-align: center; }
        .remaining { background: #ffe082; padding: 8px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: center; gap: 18px; }
        .remaining span { font-weight: bold; font-size: 16px; }
        .timer, .attempts { margin-left: 10px; }
        @media (max-width: 500px) {
            .container { max-width: 98vw; padding: 2vw; }
            .board { grid-template-columns: repeat(9, 8vw); grid-template-rows: repeat(9, 8vw); }
            .cell { width: 8vw; height: 8vw; font-size: 4vw; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>數獨遊戲</h1>
    <div class="menu">
        <label>難度：
            <select id="difficulty">
                <option value="easy">簡單</option>
                <option value="medium" selected>中等</option>
                <option value="hard">困難</option>
            </select>
        </label>
        <button onclick="startGame()">開始遊戲</button>
        <button onclick="checkAnswer()">檢查答案</button>
        <button onclick="hint()">提示</button>
        <button onclick="toggleNoteMode()" id="noteBtn">筆記</button>
        <button onclick="solvePuzzle()">求解</button>
        <button onclick="clearPuzzle()">清除</button>
        <span class="timer" id="timer">計時：0:00</span>
        <span class="attempts" id="attempts">機會：3</span>
    </div>
    <div class="remaining" id="remaining"></div>
    <div class="board" id="board"></div>
    <div class="info">點擊格子後輸入數字，開啟筆記模式後輸入數字會添加小筆記，按 Delete 清除</div>
</div>
<script>
// 數獨邏輯與 UI
const DIFFICULTY = { easy: 30, medium: 40, hard: 50 };
let puzzle = [], solution = [], original = [], notes = [], noteMode = false, timer = 0, timerInterval = null, attempts = 3;

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function isValid(board, row, col, num) {
    for (let i = 0; i < 9; i++) if (board[row][i] === num || board[i][col] === num) return false;
    let br = Math.floor(row / 3) * 3, bc = Math.floor(col / 3) * 3;
    for (let i = br; i < br + 3; i++) for (let j = bc; j < bc + 3; j++) if (board[i][j] === num) return false;
    return true;
}

function solveSudoku(board) {
    for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
            if (board[row][col] === 0) {
                for (let num = 1; num <= 9; num++) {
                    if (isValid(board, row, col, num)) {
                        board[row][col] = num;
                        if (solveSudoku(board)) return true;
                        board[row][col] = 0;
                    }
                }
                return false;
            }
        }
    }
    return true;
}

function generateCompleteBoard() {
    let board = Array.from({length:9},()=>Array(9).fill(0));
    for (let box = 0; box < 3; box++) {
        let nums = [1,2,3,4,5,6,7,8,9]; shuffle(nums);
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) board[box*3+i][box*3+j] = nums[i*3+j];
    }
    solveSudoku(board);
    return board.map(row => row.slice());
}

function createPuzzle(difficulty) {
    let complete = generateCompleteBoard();
    let puzzle = complete.map(row => row.slice());
    let cellsToRemove = DIFFICULTY[difficulty] || 40, removed = 0, attempts = 0;
    while (removed < cellsToRemove && attempts < 1000) {
        let row = Math.floor(Math.random()*9), col = Math.floor(Math.random()*9);
        if (puzzle[row][col] !== 0) {
            let backup = puzzle[row][col];
            puzzle[row][col] = 0;
            let test = puzzle.map(r => r.slice());
            if (solveSudoku(test)) removed++;
            else puzzle[row][col] = backup;
        }
        attempts++;
    }
    return [puzzle, complete];
}

function renderBoard() {
    const boardDiv = document.getElementById('board');
    boardDiv.innerHTML = '';
    for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) {
        let input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 1;
        input.className = 'cell';
        if ((Math.floor(i/3)+Math.floor(j/3))%2===0) input.style.background = '#f5f5f5';
        if (i%3===0) input.style.borderTop = '2px solid #333';
        if (j%3===0) input.style.borderLeft = '2px solid #333';
        if (i===8) input.style.borderBottom = '2px solid #333';
        if (j===8) input.style.borderRight = '2px solid #333';
        if (original[i][j] !== 0) {
            input.value = original[i][j];
            input.disabled = true;
            input.classList.add('given');
        } else {
            input.value = puzzle[i][j]!==0?puzzle[i][j]:'';
            input.addEventListener('focus',()=>input.select());
            input.addEventListener('input', e => onInput(i, j, e));
            input.addEventListener('keydown', e => onKey(i, j, e));
        }
        input.dataset.row = i;
        input.dataset.col = j;
        if (notes[i][j].size > 0 && !input.value) {
            input.classList.add('note');
            input.value = Array.from(notes[i][j]).sort().join('');
        }
        boardDiv.appendChild(input);
    }
}

function onInput(row, col, e) {
    let val = e.target.value.replace(/[^1-9]/g, '');
    if (val.length > 1) val = val[0];
    e.target.value = val;
    if (noteMode) {
        if (val) notes[row][col].add(val);
        else notes[row][col].clear();
        puzzle[row][col] = 0;
    } else {
        notes[row][col].clear();
        puzzle[row][col] = val ? parseInt(val) : 0;
        if (val && puzzle[row][col] !== solution[row][col]) {
            attempts--;
            updateAttempts();
            alert(`第 ${row+1} 行第 ${col+1} 列的數字錯誤！\n剩餘機會：${attempts}`);
            puzzle[row][col] = 0;
            e.target.value = '';
            if (attempts <= 0) {
                alert('機會用完！\n將顯示答案。');
                solvePuzzle();
                return;
            }
        }
    }
    renderBoard();
    updateRemaining();
}

function onKey(row, col, e) {
    if (e.key === 'Backspace' || e.key === 'Delete') {
        notes[row][col].clear();
        puzzle[row][col] = 0;
        renderBoard();
        updateRemaining();
    }
}

function startGame() {
    let diff = document.getElementById('difficulty').value;
    [puzzle, solution] = createPuzzle(diff);
    original = puzzle.map(row => row.slice());
    notes = Array.from({length:9},()=>Array.from({length:9},()=>new Set()));
    noteMode = false;
    document.getElementById('noteBtn').innerText = '筆記';
    attempts = 3;
    updateAttempts();
    timer = 0;
    clearInterval(timerInterval);
    timerInterval = setInterval(()=>{timer++; updateTimer();},1000);
    updateTimer();
    renderBoard();
    updateRemaining();
}

function checkAnswer() {
    if (attempts <= 0) { alert('機會已用完'); return; }
    for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) if (puzzle[i][j] === 0) { alert('請先填滿所有格子'); return; }
    for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) if (puzzle[i][j] !== solution[i][j]) { alert('答案有誤，請繼續努力'); return; }
    clearInterval(timerInterval);
    alert(`答案正確！\n耗時：${formatTime(timer)}`);
}

function toggleNoteMode() {
    noteMode = !noteMode;
    document.getElementById('noteBtn').innerText = noteMode ? '筆記模式：開啟' : '筆記';
    alert(noteMode ? '筆記模式：開啟' : '筆記模式：關閉');
}

function hint() {
    let empty = [];
    for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) if (puzzle[i][j] === 0 && original[i][j] === 0) empty.push([i, j]);
    if (empty.length) {
        let [i, j] = empty[Math.floor(Math.random()*empty.length)];
        puzzle[i][j] = solution[i][j];
        notes[i][j].clear();
        renderBoard();
        updateRemaining();
        alert(`第 ${i+1} 行第 ${j+1} 列的值是 ${solution[i][j]}`);
    } else {
        alert('沒有更多空白格子');
    }
}

function solvePuzzle() {
    if (confirm('確定要求解嗎？遊戲將結束')) {
        for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) { puzzle[i][j] = solution[i][j]; notes[i][j].clear(); }
        clearInterval(timerInterval);
        renderBoard();
        updateRemaining();
    }
}

function clearPuzzle() {
    for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) if (original[i][j] === 0) { puzzle[i][j] = 0; notes[i][j].clear(); }
    renderBoard();
    updateRemaining();
}

function updateRemaining() {
    let counts = Array(10).fill(0);
    for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) if (puzzle[i][j] !== 0) counts[puzzle[i][j]]++;
    let html = '';
    for (let num = 1; num <= 9; num++) html += `<span>${num}:${9-counts[num]}</span>`;
    document.getElementById('remaining').innerHTML = html;
}

function updateTimer() {
    document.getElementById('timer').innerText = '計時：' + formatTime(timer);
}

function updateAttempts() {
    document.getElementById('attempts').innerText = `機會：${attempts}`;
}

function formatTime(sec) {
    let m = Math.floor(sec/60), s = sec%60;
    return `${m}:${s.toString().padStart(2,'0')}`;
}

// 初始化空白棋盤
(function(){
    puzzle = Array.from({length:9},()=>Array(9).fill(0));
    solution = Array.from({length:9},()=>Array(9).fill(0));
    original = Array.from({length:9},()=>Array(9).fill(0));
    notes = Array.from({length:9},()=>Array.from({length:9},()=>new Set()));
    renderBoard();
    updateRemaining();
    updateTimer();
    updateAttempts();
})();
</script>
</body>
</html>
